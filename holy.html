<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJECT INQUINISO</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @font-face {
      font-family: 'AR PL Ukai';
      src: local('AR PL Ukai'), local('AR PL Ukai CN'), local('AR PL UKai CN'), local('Kaiti');
    }

    :root {
      --main-artwork: url('https://images.unsplash.com/photo-1517838277536-f5f99be501cd?q=80&w=1170&auto=format&fit=crop');
      --glass-surface: rgba(4, 10, 7, 0.65);
      --card-surface: rgba(8, 16, 12, 0.72);
      --card-inner: rgba(12, 24, 18, 0.80);
      
      --accent-primary: #10b981;
      --accent-secondary: #022c22;
      --accent-warm: #34d399;
      --border-accent: rgba(16, 185, 129, 0.35);
      --border-dark: rgba(255, 255, 255, 0.12);
      
      --text-main: #ecfdf5;
      --text-muted: #94a3b8;

      --subtle-glow: 0 0 15px rgba(16, 185, 129, 0.12), inset 0 0 10px rgba(16, 185, 129, 0.05);
      --active-glow: 0 0 25px rgba(16, 185, 129, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'AR PL Ukai', 'AR PL UKai CN', 'Kaiti', serif, sans-serif !important;
      scroll-behavior: smooth;
      border-radius: 0px !important;
    }

    html, body {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    html {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto !important;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background-image: linear-gradient(rgba(2, 6, 4, 0.75), rgba(1, 4, 3, 0.85)), var(--main-artwork);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: #020604;
      color: var(--text-main);
      line-height: 1.6;
      padding: 32px 24px;
    }

    /* PASSCODE SCREEN */
    #securityAuthScreen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(2, 6, 4, 0.80), rgba(1, 4, 3, 0.90)), var(--main-artwork);
      background-size: cover;
      background-position: center;
      z-index: 50000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .auth-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .auth-title {
      font-size: 2.2rem;
      letter-spacing: 8px;
      color: var(--text-main);
      margin-bottom: 32px;
      font-weight: normal;
      text-shadow: 0 0 18px rgba(16, 185, 129, 0.35);
    }

    .pin-input {
      width: 180px;
      padding: 10px 0;
      font-size: 2.2rem;
      letter-spacing: 16px;
      text-align: center;
      background: transparent;
      border: none;
      border-bottom: 2px solid rgba(255, 255, 255, 0.3);
      color: var(--text-main);
      outline: none;
      transition: all 0.3s ease;
    }

    .pin-input:focus {
      border-bottom-color: var(--accent-primary);
      box-shadow: 0 8px 16px -6px rgba(16, 185, 129, 0.4);
    }

    .auth-error {
      color: #ef4444;
      font-size: 0.9rem;
      margin-top: 18px;
      letter-spacing: 3px;
      display: none;
      text-transform: lowercase;
    }

    /* INTRO ANIMATION OVERLAY */
    #introTextOverlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(2, 6, 4, 0.88), rgba(1, 4, 3, 0.95)), var(--main-artwork);
      background-size: cover;
      background-position: center;
      z-index: 40000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .intro-text-container {
      height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      width: 100%;
      max-width: 900px;
    }

    .intro-line {
      font-size: 1.85rem;
      letter-spacing: 6px;
      color: #ffffff;
      opacity: 0;
      filter: blur(20px);
      transform: scale(0.92);
      transition: opacity 1.6s ease, filter 1.6s ease, transform 1.6s ease;
      position: absolute;
      padding: 0 20px;
    }

    .intro-line.active {
      opacity: 1;
      filter: blur(0px);
      transform: scale(1);
    }

    .intro-line.title-line {
      font-size: 2.8rem;
      letter-spacing: 12px;
      color: var(--accent-primary);
      text-shadow: 0 0 30px rgba(16, 185, 129, 0.5);
      transform: scale(0.85);
    }

    .intro-line.title-line.active {
      opacity: 1;
      filter: blur(0px);
      transform: scale(1.05);
    }

    /* MAIN APP CONTAINER */
    .app-container {
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      background: var(--glass-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-accent);
      padding: 32px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), var(--subtle-glow);
    }

    .app-header-cover {
      width: 100%;
      height: 160px;
      background: linear-gradient(rgba(2, 6, 4, 0.40), rgba(1, 4, 3, 0.80)), var(--main-artwork);
      background-size: cover;
      background-position: center;
      margin-bottom: 24px;
      border: 1px solid var(--border-accent);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px;
      box-shadow: var(--subtle-glow);
    }

    .terminal-hdr {
      font-size: 2.2rem;
      color: #ffffff;
      letter-spacing: 8px;
      font-weight: normal;
      text-shadow: 0 0 18px rgba(16, 185, 129, 0.4);
    }

    .sub-hdr {
      font-size: 0.9rem;
      color: var(--accent-warm);
      letter-spacing: 3px;
    }

    .btn-aero {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid var(--border-accent);
      color: var(--text-main);
      padding: 9px 18px;
      cursor: pointer;
      font-size: 0.85rem;
      letter-spacing: 2px;
      transition: all 0.25s ease;
      box-shadow: var(--subtle-glow);
    }

    .btn-aero:hover {
      background: rgba(16, 185, 129, 0.25);
      border-color: var(--accent-primary);
      color: #ffffff;
      box-shadow: var(--active-glow);
    }

    .btn-aero.btn-highlight {
      background: var(--accent-primary);
      border: 1px solid var(--accent-primary);
      color: #022c22;
      font-weight: bold;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.4);
    }

    .progress-section {
      background: var(--card-inner);
      border: 1px solid var(--border-accent);
      padding: 18px 24px;
      margin-bottom: 24px;
      box-shadow: var(--subtle-glow);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: rgba(4, 10, 7, 0.9);
      border: 1px solid var(--border-dark);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-warm));
      transition: width 0.4s ease;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.8);
    }

    /* HUB NAV SWITCHER */
    .hub-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .hub-card {
      background: var(--card-surface);
      border: 1px solid var(--border-accent);
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .hub-card:hover, .hub-card.active {
      background: rgba(16, 185, 129, 0.18);
      border-color: var(--accent-primary);
      box-shadow: var(--active-glow);
    }

    .hub-card-title {
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .hub-card-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      background: rgba(4, 10, 7, 0.9);
      border: 1px solid var(--border-accent);
      color: var(--text-main);
      outline: none;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .search-input:focus {
      border-color: var(--accent-warm);
      box-shadow: var(--subtle-glow);
    }

    .folder-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    details.folder-card {
      background: var(--card-surface);
      border: 1px solid var(--border-accent);
      transition: all 0.3s ease;
      box-shadow: var(--subtle-glow);
    }

    details.folder-card[open] {
      border-color: var(--accent-primary);
      box-shadow: var(--active-glow);
    }

    details.folder-card.pinned-folder {
      border-color: var(--accent-warm);
      background: rgba(16, 185, 129, 0.08);
    }

    summary.folder-summary {
      padding: 16px 20px;
      font-size: 1.1rem;
      letter-spacing: 2px;
      cursor: pointer;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      list-style: none;
      border-bottom: 1px solid transparent;
    }

    details[open] summary.folder-summary {
      border-bottom-color: var(--border-dark);
      background: rgba(4, 10, 7, 0.4);
    }

    summary.folder-summary::-webkit-details-marker {
      display: none;
    }

    .folder-title-flex {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .folder-tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      border: 1px solid var(--border-accent);
      color: var(--accent-primary);
      background: rgba(16, 185, 129, 0.1);
      letter-spacing: 1px;
    }

    .folder-content {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
      background: rgba(4, 10, 7, 0.4);
    }

    .video-card {
      background: rgba(4, 10, 7, 0.85);
      border: 1px solid var(--border-dark);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s ease;
    }

    .video-card:hover {
      border-color: var(--border-accent);
    }

    .video-title {
      font-size: 0.9rem;
      color: var(--text-main);
      letter-spacing: 1px;
      min-height: 2.8em;
      line-height: 1.4;
    }

    .iframe-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .iframe-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
      margin-top: 4px;
      user-select: none;
    }

    .check-label input[type="checkbox"] {
      accent-color: var(--accent-primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      body { padding: 12px 8px; }
      .app-container { padding: 16px; }
      .hub-selector { grid-template-columns: 1fr; }
      .folder-content { grid-template-columns: 1fr; }
      .terminal-hdr { font-size: 1.5rem; letter-spacing: 4px; }
    }
  </style>
</head>

      introTimeouts.forEach(clearTimeout);
      const textOverlay = document.getElementById('introTextOverlay');
      textOverlay.style.transition = 'opacity 0.8s ease';
      textOverlay.style.opacity = '0';
      setTimeout(() => textOverlay.style.display = 'none', 800);
    }

    document.getElementById('introTextOverlay').onclick = skipIntro;

    function authenticateAgent() {
      const pinVal = document.getElementById('agentPinInput').value.trim();
      const errorMsg = document.getElementById('authErrorMsg');

      if (pinVal === '2027') {
        errorMsg.style.display = 'none';
        document.getElementById('securityAuthScreen').style.display = 'none';
        const textOverlay = document.getElementById('introTextOverlay');
        textOverlay.style.display = 'flex';

        const lines = [
          document.getElementById('line1'),
          document.getElementById('line2'),
          document.getElementById('line3')
        ];

        let delay = 300;
        lines.forEach((line, index) => {
          let t1 = setTimeout(() => {
            if (index > 0) lines[index - 1].classList.remove('active');
            line.classList.add('active');
          }, delay);
          introTimeouts.push(t1);
          delay += 1800;
        });

        let tFinish = setTimeout(() => {
          textOverlay.style.transition = 'opacity 1.2s ease';
          textOverlay.style.opacity = '0';
          setTimeout(() => textOverlay.style.display = 'none', 1200);
        }, delay + 800);
        introTimeouts.push(tFinish);
      } else {
        errorMsg.style.display = 'block';
        document.getElementById('agentPinInput').value = '';
      }
    }

    const pinInput = document.getElementById('agentPinInput');
    const submitBtn = document.getElementById('authSubmitBtn');

    pinInput.addEventListener('input', (e) => {
      if (e.target.value.trim().length === 4) authenticateAgent();
    });
    pinInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') authenticateAgent();
    });
    submitBtn.addEventListener('click', authenticateAgent);

    function saveProgress() {
      localStorage.setItem('inquiniso_dual_progress', JSON.stringify(progressData));

    function toggleCompletion(type, dayNum) {
      if (!progressData[type]) progressData[type] = {};
      progressData[type][dayNum] = !progressData[type][dayNum];
      saveProgress();
    }

    function updateProgressBar() {
      let workoutDone = 0;
      let medDone = 0;

      for (let i = 1; i <= 45; i++) {
        if (progressData.workout[i]) workoutDone++;
        if (progressData.meditation[i]) medDone++;
      }

      const totalDone = workoutDone + medDone;
      const totalPct = Math.round((totalDone / 90) * 100);

      document.getElementById('workoutSub').textContent = `${workoutDone} / 45 DAYS COMPLETED (${Math.round((workoutDone/45)*100)}%)`;
      document.getElementById('meditationSub').textContent = `${medDone} / 45 DAYS COMPLETED (${Math.round((medDone/45)*100)}%)`;

      document.getElementById('progressStats').textContent = `${totalDone} / 90 UNITS COMPLETED (${totalPct}%)`;
      document.getElementById('progressBarFill').style.width = `${totalPct}%`;

      currentMode = mode;
      document.getElementById('hubWorkoutBtn').classList.toggle('active', mode === 'workout');

      renderFolders();
    }

    function filterFolders() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const folders = document.querySelectorAll('.folder-card');

      folders.forEach(f => {
        const text = f.innerText.toLowerCase();
        if (text.includes(q)) {
          f.style.display = 'block';
          if (q.length > 1) f.open = true;
        } else {
          f.style.display = 'none';
        }
      });
    }

    function expandAll() {
      document.querySelectorAll('.folder-card').forEach(f => f.open = true);
    }

    function collapseAll() {
      document.querySelectorAll('.folder-card').forEach(f => f.open = false);
    }
