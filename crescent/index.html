<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJECT INQUINISO</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Use Raleway (thin) from Google Fonts for a clean modern look -->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;300;400&display=swap" rel="stylesheet">
  <style type="text/css">
    /* Fallback local font declaration removed in favor of Raleway for consistency */

    :root {
      /* Main Background Artwork (updated per request) */
      --main-artwork: url('https://blog.elementary.io/images/os-8-available-now/Desktop/mountains.jpg');
      
      /* Section Specific Banner Artwork */
      --banner-stoic: url('https://images.unsplash.com/photo-1468657988500-aca2be09f4c6?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
      --banner-test: url('https://images.unsplash.com/photo-1569470451072-68314f596aec?q=80&w=1631&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
      --banner-journal: url('https://images.unsplash.com/photo-1545091741-2231068f3478?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
      
      /* Translucent Dark Glass Surface */
      --glass-surface: rgba(4, 10, 7, 0.45);
      --card-surface: rgba(8, 16, 12, 0.52);
      --card-inner: rgba(12, 24, 18, 0.60);
      
      /* Emerald Green Tactical Palette */
      --accent-primary: #10b981;
      --accent-secondary: #022c22;
      --accent-warm: #34d399;
      --border-accent: rgba(16, 185, 129, 0.35);
      --border-dark: rgba(255, 255, 255, 0.12);
      
      --text-main: #ecfdf5;
      --text-muted: #94a3b8;

      /* Glowing Shadow FX */
      --subtle-glow: 0 0 15px rgba(16, 185, 129, 0.08), inset 0 0 10px rgba(16, 185, 129, 0.03);
      --active-glow: 0 0 22px rgba(16, 185, 129, 0.28);

      --tag-crimson: rgba(16, 185, 129, 0.85);
      --tag-slate: rgba(40, 60, 50, 0.85);
      --tag-indigo: rgba(15, 75, 55, 0.85);
      --tag-amber: rgba(180, 110, 25, 0.85);
      --tag-emerald: rgba(5, 150, 105, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* Use Raleway as primary font, light weight for a thin look */
      font-family: 'Raleway', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif !important;
      scroll-behavior: smooth;
      border-radius: 0px !important;
    }

    /* SCROLLBAR MANAGEMENT (HIDDEN VISUALLY WITH FULL SCROLL FUNCTIONALITY) */
    html, body, div, textarea, section, table, .habit-table-wrapper, .scrollable-list, .todo-list-box, .editor-box-frameless, #fsStoicDetails, .rating-scroll-container, .rating-display-lock {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    html {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto !important;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background-image: linear-gradient(rgba(2, 6, 4, 0.50), rgba(1, 4, 3, 0.62)), var(--main-artwork);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: #020604;
      color: var(--text-main);
      line-height: 1.6;
      padding: 32px 24px;
      /* Slightly lighter base font-weight for the thin aesthetic */
      font-weight: 300;
    }

    /* PASSCODE SCREEN */
    #securityAuthScreen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(2, 6, 4, 0.70), rgba(1, 4, 3, 0.82)), var(--main-artwork);
      background-size: cover;
      background-position: center;
      z-index: 50000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .auth-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .auth-title {
      font-size: 2.2rem;
      letter-spacing: 8px;
      color: var(--text-main);
      margin-bottom: 36px;
      font-weight: 300;
      text-shadow: 0 0 18px rgba(16, 185, 129, 0.35);
    }

    .pin-input {
      width: 180px;
      padding: 10px 0;
      font-size: 2.2rem;
      letter-spacing: 16px;
      text-align: center;
      background: transparent;
      border: none;
      border-bottom: 2px solid rgba(255, 255, 255, 0.3);
      color: var(--text-main);
      outline: none;
      transition: all 0.3s ease;
      font-weight: 300;
    }

    .pin-input:focus {
      border-bottom-color: var(--accent-primary);
      box-shadow: 0 8px 16px -6px rgba(16, 185, 129, 0.4);
    }

    .auth-error {
      color: #ef4444;
      font-size: 0.9rem;
      margin-top: 24px;
      letter-spacing: 3px;
      display: none;
      text-transform: lowercase;
    }

    /* INTRO ANIMATION OVERLAY */
    #introTextOverlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(2, 6, 4, 0.85), rgba(1, 4, 3, 0.92)), var(--main-artwork);
      background-size: cover;
      background-position: center;
      z-index: 40000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .intro-text-container {
      height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      width: 100%;
      max-width: 900px;
    }

    .intro-line {
      font-size: 1.85rem;
      letter-spacing: 6px;
      color: #ffffff;
      opacity: 0;
      filter: blur(20px);
      transform: scale(0.92);
      transition: opacity 1.6s ease, filter 1.6s ease, transform 1.6s ease;
      position: absolute;
      padding: 0 20px;
      font-weight: 300;
    }

    .intro-line.active {
      opacity: 1;
      filter: blur(0px);
      transform: scale(1);
    }

    .intro-line.title-line {
      font-size: 2.8rem;
      letter-spacing: 12px;
      color: var(--accent-primary);
      text-shadow: 0 0 30px rgba(16, 185, 129, 0.5);
      transform: scale(0.85);
    }

    .intro-line.title-line.active {
      opacity: 1;
      filter: blur(0px);
      transform: scale(1.05);
    }

    /* MAIN APP CONTAINER */
    .app-container {
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      background: var(--glass-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-accent);
      padding: 32px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), var(--subtle-glow);
    }

    .app-header-cover {
      width: 100%;
      height: 160px;
      background: linear-gradient(rgba(2, 6, 4, 0.35), rgba(1, 4, 3, 0.70)), var(--main-artwork);
      background-size: cover;
      background-position: center;
      margin-bottom: 24px;
      border: 1px solid var(--border-accent);
      display: flex;
      align-items: flex-end;
      padding: 24px;
      box-shadow: var(--subtle-glow);
    }

    .terminal-hdr {
      font-size: 2.2rem;
      color: #ffffff;
      letter-spacing: 8px;
      font-weight: 300;
      text-shadow: 0 0 18px rgba(16, 185, 129, 0.4);
    }

    .top-hero-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border-dark);
      flex-wrap: wrap;
    }

    .hero-countdown-box {
      flex: 1;
      min-width: 320px;
      background: var(--card-inner);
      border: 1px solid var(--border-accent);
      padding: 16px 22px;
      box-shadow: var(--subtle-glow);
    }

    .countdown-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .countdown-title { font-size: 0.95rem; color: var(--text-main); letter-spacing: 2px; }
    .countdown-timer-text { font-size: 1.25rem; color: var(--accent-primary); letter-spacing: 2px; text-shadow: 0 0 12px rgba(16, 185, 129, 0.3); }

    /* TEXT HEADER LINKS */
    .quick-nav-links {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: center;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.92rem;
      letter-spacing: 3px;
      padding: 6px 8px;
      border: none;
      background: transparent;
      position: relative;
      transition: all 0.3s ease;
    }

    .nav-link::after {
      content: ''; 
      position: absolute;
      bottom: -2px;
      left: 50%;
      width: 0;
      height: 1px;
      background: var(--accent-primary);
      transition: all 0.3s ease;
      transform: translateX(-50%);
      box-shadow: 0 0 8px var(--accent-primary);
    }

    .nav-link:hover {
      color: var(--text-main);
      text-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
    }

    .nav-link:hover::after {
      width: 90%;
    }

    .btn-aero {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid var(--border-accent);
      color: var(--text-main);
      padding: 9px 18px;
      cursor: pointer;
      font-size: 0.85rem;
      letter-spacing: 2px;
      transition: all 0.25s ease;
      box-shadow: var(--subtle-glow);
    }

    .btn-aero:hover {
      background: rgba(16, 185, 129, 0.25);
      border-color: var(--accent-primary);
      color: #ffffff;
      box-shadow: var(--active-glow);
    }

    .btn-aero.btn-highlight {
      background: var(--accent-primary);
      border: 1px solid var(--accent-primary);
      color: #022c22;
      font-weight: 700;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.4);
    }

    .btn-aero.btn-highlight:hover {
      background: var(--accent-warm);
      border-color: var(--accent-warm);
      color: #022c22;
      box-shadow: 0 0 25px rgba(52, 211, 153, 0.6);
    }

    .btn-sm { padding: 4px 10px; font-size: 0.75rem; }
    .btn-edit { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-dark); color: var(--text-main); cursor: pointer; font-size: 0.75rem; padding: 4px 8px; transition: all 0.2s; }
    .btn-edit:hover { background: rgba(16, 185, 129, 0.25); border-color: var(--accent-primary); }
    .btn-danger { background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 0.88rem; margin-left: 6px; transition: transform 0.2s; }
    .btn-danger:hover { transform: scale(1.15); color: #f87171; }

    .section-banner-img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      margin-bottom: 12px;
      opacity: 0.80;
      border: 1px solid var(--border-accent);
      filter: saturate(0.85) contrast(1.1);
      box-shadow: var(--subtle-glow);
    }

    .month-picker {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .month-picker h2 {
      font-size: 1.15rem;
      color: var(--text-main);
      min-width: 200px;
      text-align: center;
      letter-spacing: 2px;
    }

    /* MATRIX TABLE */
    .habit-table-wrapper {
      overflow-x: auto !important;
      border: 1px solid var(--border-accent);
      background: rgba(4, 10, 7, 0.55);
      margin-bottom: 24px;
      box-shadow: var(--subtle-glow);
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { border: 1px solid rgba(255, 255, 255, 0.08); text-align: center; padding: 9px 4px; }
    th { background: rgba(8, 16, 12, 0.85); color: var(--text-muted); font-size: 0.8rem; letter-spacing: 1px; }

    .habit-col {
      text-align: left;
      padding-left: 12px;
      padding-right: 8px;
      min-width: 180px;
      max-width: 220px;
      white-space: normal !important;
      word-break: break-word;
      overflow-wrap: anywhere;
      background: rgba(6, 14, 10, 0.92);
      color: var(--text-main);
      position: sticky;
      left: 0;
      z-index: 2;
    }

    th.today, td.today { background: rgba(16, 185, 129, 0.25) !important; color: #ffffff !important; }
    .checkbox-cell { cursor: pointer; user-select: none; width: 28px; height: 28px; transition: background 0.15s ease; }
    .checkbox-cell:hover { background-color: rgba(16, 185, 129, 0.3); }

    .checked-crimson { background-color: var(--tag-crimson) !important; color: #022c22; font-weight: bold; }
    .checked-slate   { background-color: var(--tag-slate)   !important; color: #fff; }
    .checked-indigo  { background-color: var(--tag-indigo)  !important; color: #fff; }
    .checked-amber   { background-color: var(--tag-amber)   !important; color: #fff; }
    .checked-emerald { background-color: var(--tag-emerald) !important; color: #fff; }

    /* STRICT FIXED-HEIGHT DAILY ASSESSMENT BOX */
    #dailyRatingSection {
      margin-bottom: 24px;
      height: 320px;
      min-height: 320px;
      max-height: 320px;
      overflow: hidden;
    }

    /* ... rest of CSS unchanged ... */

    /* Keep the rest of the stylesheet as-is (truncated here in-editor for brevity) */
  </style>
</head>
<body>

  <div id="securityAuthScreen">
    <div class="auth-container">
      <div class="auth-title">PROJECT INQUINISO</div>
      <input type="password" id="agentPinInput" class="pin-input" maxlength="4" autofocus placeholder="">
      <button id="initialStartBtn" style="display:none;"></button>
      <div class="auth-error" id="authErrorMsg">invalid</div>
    </div>
  </div>

  <div id="introTextOverlay">
    <div class="intro-text-container">
      <div class="intro-line" id="line1">Recursion of self negation</div>
      <div class="intro-line" id="line2">Rhythm of ordinary</div>
      <div class="intro-line title-line" id="line3">Project Inquiniso</div>
    </div>
  </div>

  <div class="app-container">
    <div class="app-header-cover">
      <div class="terminal-hdr">PROJECT INQUINISO</div>
    </div>

    <div class="top-hero-nav">
      <div class="hero-countdown-box">
        <div class="countdown-header-flex">
          <span class="countdown-title" id="countdownTitle">Good Day</span>
          <button class="btn-aero btn-sm" id="editDeadlineBtn">Set Good Day</button>
        </div>
        <div class="countdown-timer-text" id="neetCountdown">Calculating time...</div>
      </div>

      <div class="quick-nav-links">
        <a href="#habitsSection" class="nav-link">HABITS</a>
        <a href="#dailyRatingSection" class="nav-link">EVALUATION</a>
        <a href="#todoSection" class="nav-link">TASKS</a>
        <a href="#stoicSection" class="nav-link">REFLECTION</a>
        <a href="#journalSection" class="nav-link">JOURNALS</a>
        <button class="btn-aero btn-highlight" id="openTimerBtn">Focus Session</button>
      </div>
    </div>

    <div style="display:flex; justify-content: flex-end; gap:8px; margin-bottom: 16px;">
      <button class="btn-aero" id="exportBtn">Export Backup</button>
      <button class="btn-aero" id="importBtn">Import Backup</button>
      <input type="file" id="importFileInput" style="display: none;" accept=".json">
    </div>

    <div id="habitsSection">
      <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:10px;">
        <div class="month-picker" style="margin:0;">
          <button class="btn-aero" id="prevMonth">&lt;</button>
          <h2 id="currentMonthLabel">Month Year</h2>
          <button class="btn-aero" id="nextMonth">&gt;</button>
        </div>
        <button class="btn-aero btn-highlight" id="openHabitModal">+ Add Daily Habit</button>
      </div>

      <div class="habit-table-wrapper">
        <table id="habitsTable">
          <thead>
            <tr id="dayOfWeekRow"></tr>
            <tr id="dayOfMonthRow"></tr>
          </thead>
          <tbody id="habitsBody"></tbody>
        </table>
      </div>
    </div>

    <!-- rest of body unchanged -->
  </div>

</body>
</html>
